[project]
name = "witness-core"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "cryptography>=43",
  "jwcrypto>=1.5.6",
  "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_core"]
