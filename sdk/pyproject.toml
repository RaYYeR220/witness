[project]
name = "witness-sdk"
version = "0.1.0"
requires-python = ">=3.12.1"
license = "Apache-2.0"
dependencies = [
  "witness-core",
  "httpx>=0.27",
  "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_sdk"]
