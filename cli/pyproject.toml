[project]
name = "witness-cli"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "witness-core",
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.9",
]

[project.scripts]
witness = "witness_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_cli"]
