[project]
name = "witness-relay"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "witness-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "aiomqtt>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_relay"]
