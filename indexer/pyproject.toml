[project]
name = "witness-indexer"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "witness-core",
  "psycopg[binary,pool]>=3.2",
  "grpcio>=1.66",
  "protobuf>=5.28",
  "httpx>=0.27",
  "aiomqtt>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_indexer"]
