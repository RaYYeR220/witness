[project]
name = "witness-mcp"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "witness-core",
  "mcp>=1.9",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_mcp"]
