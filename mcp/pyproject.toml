[project]
name = "witness-mcp"
version = "0.1.0"
requires-python = ">=3.12.1"
license = "Apache-2.0"
dependencies = [
  "witness-core",
  "mcp>=2",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.scripts]
witness-mcp = "witness_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_mcp"]
