[project]
name = "witness-api"
version = "0.1.0"
requires-python = ">=3.12.1"
license = "Apache-2.0"
dependencies = [
  "witness-core",
  "witness-indexer",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.scripts]
witness-api = "witness_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_api"]
