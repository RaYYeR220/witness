; Trust Manager configuration for the patched (producer-signing) Trust Manager.
; Same algorithm settings as deploy/compose/manager.ini; differences:
;  - uploads go to the witness relay, which checks the signature and the writer policy;
;  - the score store lives on the /data volume (the root filesystem is read-only).
[General]
port = 3000
storageName = /data/scores
storageReset = yes

[Connections]
domain = MyDomain
ngsild_cb_url = orion-ld:1026
iota_api_url = witness-relay:5555
iota_node_ip = iota-hornet
log_file_port = 8000

[TrustAlgorithm]
; local override: score every minute so the stack produces trust.score blocks quickly
scoreInterval = 1
reliabilityInterval = 20
reputationInterval = 7
healthPenalty = 0.01
ReliabilityWeight = 0.3
SecurityWeight = 0.5
ReputationWeight = 0.2
priorityThreshold = 3
notificationThreshold = 10

[ReliabilityScore]
cpuCores = +0.2
currentCpuUsage = -0.2
ramCapacity = +0.1
availableRam = +0.25
currentRamUsage = -0.25

[SecurityScore]
priority_1 = 0.25
priority_2 = 0.35
priority_3 = 0.4

[ReputationScore]
priority_1 = 0.25
priority_2 = 0.35
priority_3 = 0.4
