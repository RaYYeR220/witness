# Witness / aeriOS broker. Every client logs in (no anonymous access) and is limited to its
# topics by mosquitto.acl. The password file is generated into secrets/mosquitto/ by
# deploy/compose/setup-secrets.sh and copied, with the ACL, into /mosquitto/auth (owned by
# the broker user) when the container starts. Host ports are bound to loopback only.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# QoS 1 submission records queued for the indexer's persistent session survive a restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
listener 9001
protocol websockets
