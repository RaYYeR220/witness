{{- $c := dict "ctx" . "component" "api" "values" .Values.api }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "witness.componentName" $c }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "witness.labels" $c | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "witness.selectorLabels" $c | nindent 4 }}
