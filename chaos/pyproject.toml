[project]
name = "witness-chaos"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "witness-core",
  "witness-sdk",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "aiomqtt>=2.3",
  "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness_chaos"]
